# ===== J-Link + SWD + STM32F103 配置 =====
# 第一行：告诉 OpenOCD 使用 J-Link 调试器（从 OpenOCD 自带的脚本目录里找）
source [find interface/jlink.cfg]

# 第二行：强制使用 SWD 通信方式（只需 SWDIO + SWCLK 两根线）
transport select swd

# 第三行：告诉 OpenOCD 目标芯片是 STM32F1 系列（蓝药丸 F103）
# OpenOCD 会按 F1 的方式去操作 Flash 和调试接口
source [find target/stm32f1x.cfg]
